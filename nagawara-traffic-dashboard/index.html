<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nagawara Junction — Traffic Management Dashboard</title>
  <script src="libs/react.development.js"></script>
  <script src="libs/react-dom.development.js"></script>
  <script src="libs/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, "Segoe UI", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; font-size: 14px; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1e293b; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

    .app { display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { display: flex; align-items: center; gap: 10px; }
    .topbar-title h1 { font-size: 16px; font-weight: 700; color: #f1f5f9; }
    .topbar-title span { font-size: 12px; color: #64748b; }
    .topbar-status { display: flex; align-items: center; gap: 16px; }
    .live-badge { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #22c55e; font-weight: 600; }
    .live-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
    .time-display { font-size: 12px; color: #94a3b8; font-variant-numeric: tabular-nums; }

    /* Main grid: 3 cols, 2 rows + bottom row */
    .main { display: grid; grid-template-columns: 1fr 1fr 320px; grid-template-rows: auto auto; gap: 12px; padding: 12px; flex: 1; }
    .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }

    .card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 600; color: #cbd5e1; display: flex; align-items: center; gap: 7px; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
    .badge-green { background: #14532d; color: #22c55e; }
    .badge-yellow { background: #713f12; color: #fbbf24; }
    .badge-red { background: #7f1d1d; color: #f87171; }
    .badge-blue { background: #1e3a5f; color: #60a5fa; }
    .badge-purple { background: #3b1f6e; color: #a78bfa; }

    /* Junction SVG */
    .junction-wrap { display: flex; justify-content: center; align-items: center; padding: 8px 0; }
    .arm-label { font-size: 11px; fill: #94a3b8; font-family: -apple-system, "Segoe UI", sans-serif; font-weight: 600; }
    .road { fill: #334155; }
    .road-line { stroke: #475569; stroke-width: 1; stroke-dasharray: 6,5; }
    .junction-box { fill: #475569; }

    /* Density cards */
    .arms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .arm-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    .arm-card-name { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
    .arm-card-count { font-size: 22px; font-weight: 700; }
    .arm-card-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
    .density-bar { height: 5px; background: #1e293b; border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .density-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }

    /* Signal panel */
    .signals-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .signal-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    .signal-card-name { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 8px; text-transform: uppercase; }
    .traffic-light { display: flex; flex-direction: column; align-items: center; gap: 5px; background: #1a1a2e; border-radius: 8px; padding: 8px; width: 36px; margin: 0 auto 8px; border: 1px solid #334155; }
    .light { width: 16px; height: 16px; border-radius: 50%; border: 1px solid #0f172a; transition: all 0.4s; }
    .light-red-on    { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
    .light-red-off   { background: #3f1f1f; }
    .light-yellow-on { background: #fbbf24; box-shadow: 0 0 8px #fbbf24; }
    .light-yellow-off{ background: #3f3010; }
    .light-green-on  { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    .light-green-off { background: #0f2f1f; }
    .signal-phase-label { font-size: 11px; font-weight: 700; text-align: center; }
    .signal-timer { font-size: 18px; font-weight: 700; text-align: center; color: #f1f5f9; font-variant-numeric: tabular-nums; }
    .signal-timer-label { font-size: 10px; color: #64748b; text-align: center; }
    .mode-toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .toggle-switch { width: 36px; height: 20px; background: #334155; border-radius: 10px; position: relative; cursor: pointer; transition: background 0.3s; }
    .toggle-switch.on { background: #2563eb; }
    .toggle-knob { width: 14px; height: 14px; background: white; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: left 0.3s; }
    .toggle-switch.on .toggle-knob { left: 19px; }

    /* Notifications side panel */
    .notif-panel { grid-column: 3; grid-row: 1 / 3; display: flex; flex-direction: column; gap: 10px; }
    .notif-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; max-height: 440px; }
    .notif-item { background: #0f172a; border-radius: 8px; padding: 9px 11px; border-left: 3px solid; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { opacity:0; transform: translateX(16px); } to { opacity:1; transform: translateX(0); } }
    .notif-item.critical { border-color: #ef4444; }
    .notif-item.warning  { border-color: #fbbf24; }
    .notif-item.info     { border-color: #3b82f6; }
    .notif-item.clear    { border-color: #22c55e; }
    .notif-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }
    .notif-type  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .notif-time  { font-size: 10px; color: #64748b; }
    .notif-msg   { font-size: 12px; color: #cbd5e1; line-height: 1.4; }
    .notif-meta  { font-size: 10px; color: #64748b; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
    .notif-item.critical .notif-type { color: #f87171; }
    .notif-item.warning  .notif-type { color: #fbbf24; }
    .notif-item.info     .notif-type { color: #60a5fa; }
    .notif-item.clear    .notif-type { color: #22c55e; }

    /* Traveller broadcast log */
    .broadcast-scroll { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; max-height: 320px; }
    .broadcast-item { background: #0f172a; border-radius: 7px; padding: 8px 11px; border: 1px solid #334155; display: flex; gap: 10px; align-items: flex-start; animation: slideIn 0.3s ease; }
    .broadcast-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex-shrink: 0; color: #fff; }
    .broadcast-body { flex: 1; min-width: 0; }
    .broadcast-name { font-size: 12px; font-weight: 600; color: #f1f5f9; }
    .broadcast-dist { font-size: 10px; color: #64748b; }
    .broadcast-msg  { font-size: 11px; color: #94a3b8; margin-top: 2px; line-height: 1.4; }
    .broadcast-time { font-size: 10px; color: #475569; margin-top: 2px; }
    .broadcast-alt  { margin-top: 5px; background: #0d2015; border: 1px solid #22c55e33; border-radius: 5px; padding: 5px 8px; }
    .broadcast-alt-title { font-size: 10px; font-weight: 700; color: #22c55e; margin-bottom: 2px; }
    .broadcast-alt-name  { font-size: 11px; font-weight: 600; color: #f1f5f9; }
    .broadcast-alt-via   { font-size: 10px; color: #64748b; margin-top: 1px; }
    .broadcast-alt-avoid { font-size: 10px; color: #fbbf24; margin-top: 2px; }
    .broadcast-exit { margin-top: 5px; background: #0f172a; border: 1px solid #3b82f633; border-radius: 5px; padding: 5px 8px; display: flex; align-items: center; gap: 8px; }
    .broadcast-exit-val  { font-size: 16px; font-weight: 700; color: #60a5fa; }
    .broadcast-exit-label{ font-size: 10px; color: #64748b; }
    .toast-alt  { margin-top: 6px; background: #0d2015; border: 1px solid #22c55e44; border-radius: 5px; padding: 5px 8px; }
    .toast-alt-title { font-size: 10px; font-weight: 700; color: #22c55e; }
    .toast-alt-name  { font-size: 11px; font-weight: 600; color: #f1f5f9; }
    .toast-alt-via   { font-size: 10px; color: #94a3b8; }
    .toast-exit { margin-top: 5px; font-size: 11px; color: #60a5fa; font-weight: 600; }

    /* Radius map */
    .radius-map-wrap { display: flex; justify-content: center; }

    /* Toast */
    .toast-container { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 9999; pointer-events: none; }
    .toast { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 12px 16px; min-width: 290px; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); pointer-events: all; animation: toastIn 0.4s cubic-bezier(0.16,1,0.3,1); display: flex; gap: 10px; align-items: flex-start; }
    @keyframes toastIn { from { opacity:0; transform: translateY(20px) scale(0.95); } to { opacity:1; transform: translateY(0) scale(1); } }
    .toast-icon  { font-size: 20px; flex-shrink: 0; }
    .toast-body  { flex: 1; }
    .toast-title { font-size: 13px; font-weight: 700; color: #f1f5f9; margin-bottom: 3px; }
    .toast-desc  { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    .toast-reach { font-size: 11px; color: #a78bfa; margin-top: 4px; font-weight: 600; }
    .toast-close { background: none; border: none; color: #64748b; cursor: pointer; font-size: 16px; line-height: 1; padding: 0; }

    /* Charts */
    .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 70px; padding-top: 4px; }
    .chart-bar-wrap { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; }
    .chart-bar { width: 100%; border-radius: 3px 3px 0 0; transition: height 0.6s ease; min-height: 2px; }
    .chart-bar-label { font-size: 9px; color: #64748b; }
    .chart-bar-val   { font-size: 9px; color: #94a3b8; }

    /* Stats row */
    .stats-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 12px; }
    .stat-card  { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    .stat-val   { font-size: 22px; font-weight: 700; color: #f1f5f9; }
    .stat-label { font-size: 11px; color: #64748b; margin-top: 2px; }

    .full-span { grid-column: 1 / 3; }

    /* GPS Sensor Panel */
    .gps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .gps-sensor-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; }
    .gps-sensor-name { font-size: 10px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
    .gps-lock { display: flex; align-items: center; gap: 4px; font-size: 10px; }
    .gps-lock-dot { width: 6px; height: 6px; border-radius: 50%; }
    .gps-coords { font-size: 10px; color: #64748b; font-variant-numeric: tabular-nums; margin-bottom: 4px; }
    .gps-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .gps-metric { background: #1e293b; border-radius: 5px; padding: 4px 8px; }
    .gps-metric-val { font-size: 14px; font-weight: 700; color: #f1f5f9; }
    .gps-metric-unit { font-size: 9px; color: #64748b; }
    .gps-heading-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #1e3a5f; color: #60a5fa; font-weight: 600; }

    /* Segment Speed Map */
    .seg-arm { margin-bottom: 10px; }
    .seg-arm-name { font-size: 11px; color: #94a3b8; font-weight: 600; margin-bottom: 5px; display: flex; align-items: center; justify-content: space-between; }
    .seg-row { display: flex; gap: 4px; }
    .seg-block { flex: 1; border-radius: 5px; padding: 6px 5px; text-align: center; border: 1px solid #334155; }
    .seg-label { font-size: 9px; color: #64748b; }
    .seg-speed { font-size: 13px; font-weight: 700; }
    .seg-flow  { font-size: 9px; margin-top: 1px; }

    /* Route Advisor */
    .route-tabs { display: flex; gap: 6px; margin-bottom: 10px; }
    .route-tab { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; cursor: pointer; text-align: center; font-size: 12px; font-weight: 600; color: #64748b; transition: all 0.2s; }
    .route-tab.active-2w { border-color: #f59e0b; background: #2d1f00; color: #fbbf24; }
    .route-tab.active-4w { border-color: #3b82f6; background: #0f1f3d; color: #60a5fa; }
    .route-card { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .route-card.fastest { border-color: #22c55e; }
    .route-card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .route-rank { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 10px; }
    .route-rank-1 { background: #14532d; color: #22c55e; }
    .route-rank-2 { background: #1e3a5f; color: #60a5fa; }
    .route-rank-3 { background: #3b1f6e; color: #a78bfa; }
    .route-name { font-size: 13px; font-weight: 700; color: #f1f5f9; }
    .route-via  { font-size: 11px; color: #64748b; margin-top: 2px; }
    .route-stats { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .route-stat { font-size: 11px; color: #94a3b8; }
    .route-stat strong { color: #f1f5f9; }
    .route-note-2w { font-size: 10px; color: #fbbf24; margin-top: 4px; }
    .route-note-4w { font-size: 10px; color: #60a5fa; margin-top: 4px; }

    /* ── NammaFix Citizen Reports Integration ───────────────────────────── */
    .nf-section { padding: 0 12px 12px; }
    .nf-section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .nf-section-title { font-size: 15px; font-weight: 700; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
    .nf-section-sub { font-size: 11px; color: #64748b; margin-top: 2px; }
    .nf-grid { display: grid; grid-template-columns: 1fr 1fr 340px; gap: 12px; }

    /* Complaint feed */
    .nf-feed { display: flex; flex-direction: column; gap: 8px; }
    .nf-feed-tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
    .nf-tab { padding: 4px 12px; border-radius: 20px; border: 1px solid #334155; background: #0f172a; color: #64748b; font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .nf-tab.active { background: #f97316; border-color: #f97316; color: #fff; }
    .nf-complaint { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 11px 13px; display: flex; gap: 10px; align-items: flex-start; border-left: 3px solid; cursor: pointer; transition: background 0.15s; }
    .nf-complaint:hover { background: #1e293b; }
    .nf-complaint.sev-critical { border-left-color: #ef4444; }
    .nf-complaint.sev-high     { border-left-color: #f97316; }
    .nf-complaint.sev-medium   { border-left-color: #fbbf24; }
    .nf-complaint.sev-low      { border-left-color: #22c55e; }
    .nf-c-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; flex-shrink: 0; }
    .nf-c-title { font-size: 12px; font-weight: 700; color: #f1f5f9; }
    .nf-c-meta  { font-size: 10px; color: #64748b; margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; }
    .nf-c-desc  { font-size: 11px; color: #94a3b8; margin-top: 3px; line-height: 1.4; }
    .nf-c-tags  { display: flex; gap: 5px; margin-top: 5px; flex-wrap: wrap; }
    .nf-tag     { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 600; border: 1px solid; }
    .nf-tag-red    { background: #7f1d1d33; color: #f87171; border-color: #7f1d1d; }
    .nf-tag-orange { background: #7c2d1233; color: #fb923c; border-color: #7c2d12; }
    .nf-tag-yellow { background: #71390033; color: #fbbf24; border-color: #713900; }
    .nf-tag-green  { background: #14532d33; color: #4ade80; border-color: #14532d; }
    .nf-tag-blue   { background: #1e3a5f33; color: #60a5fa; border-color: #1e3a5f; }
    .nf-upvote { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #64748b; cursor: pointer; padding: 3px 7px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; transition: all 0.15s; margin-top: 6px; width: fit-content; }
    .nf-upvote:hover { border-color: #f97316; color: #f97316; }
    .nf-upvote.voted { border-color: #f97316; color: #f97316; background: #f9731610; }

    /* File report panel */
    .nf-file-card { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .nf-label  { font-size: 11px; font-weight: 600; color: #94a3b8; margin-bottom: 4px; }
    .nf-input  { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 8px 10px; color: #f1f5f9; font-size: 12px; outline: none; transition: border-color 0.2s; }
    .nf-input:focus { border-color: #f97316; }
    .nf-textarea { resize: vertical; min-height: 64px; }
    .nf-select { appearance: none; cursor: pointer; }
    .nf-type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .nf-type-btn { background: #0f172a; border: 1px solid #334155; border-radius: 7px; padding: 7px 4px; text-align: center; font-size: 10px; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.15s; }
    .nf-type-btn.selected { border-color: #f97316; background: #f9731615; color: #fb923c; }
    .nf-submit-btn { width: 100%; padding: 10px; border-radius: 8px; background: #f97316; color: #fff; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: background 0.2s; }
    .nf-submit-btn:hover { background: #ea6e10; }
    .nf-submit-btn:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
    .nf-success { background: #0d2015; border: 1px solid #22c55e55; border-radius: 8px; padding: 12px; text-align: center; }

    /* Ward scoreboard */
    .nf-ward-list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; max-height: 480px; }
    .nf-ward-card { background: #0f172a; border: 1px solid #334155; border-radius: 9px; padding: 10px 12px; }
    .nf-ward-top  { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .nf-ward-name { font-size: 12px; font-weight: 700; color: #f1f5f9; }
    .nf-ward-corp { font-size: 10px; color: #64748b; margin-top: 1px; }
    .nf-ward-bar  { height: 5px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .nf-ward-fill { height: 100%; border-radius: 3px; }
    .nf-ward-stats { display: flex; gap: 10px; margin-top: 5px; }
    .nf-ward-stat  { font-size: 10px; color: #64748b; }
    .nf-ward-stat strong { color: #94a3b8; }
    .nf-shame { background: #3f0a0a; border: 1px solid #ef4444; border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; font-size: 11px; color: #f87171; }
    .nf-shame strong { color: #fca5a5; }
    .nf-traffic-link { display: flex; align-items: center; gap: 5px; font-size: 10px; color: #60a5fa; margin-top: 4px; cursor: pointer; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ─── Junction Configuration ────────────────────────────────────────────────
const ARMS = [
  { id: 'north', name: 'North — Hebbal / ORR',         short: 'Hebbal',     color: '#3b82f6', angle: 270 },
  { id: 'south', name: 'South — RT Nagar',              short: 'RT Nagar',   color: '#a855f7', angle: 90  },
  { id: 'east',  name: 'East — Kalyan Nagar',           short: 'Kalyan Ngr', color: '#f59e0b', angle: 0   },
  { id: 'west',  name: 'West — Thanisandra / Manyata',  short: 'Manyata',    color: '#22c55e', angle: 180 },
];

// Nagawara Junction real coordinates (used only for labelling)
const JUNCTION_LAT = 13.0475, JUNCTION_LNG = 77.6219;

// ─── 5km Radius Traveller Seed Data ─────────────────────────────────────────
// 20 simulated travellers: name, nearest arm they're heading toward, distance (km), bearing
const TRAVELLER_SEEDS = [

// ─── Helpers ─────────────────────────────────────────────────────────────────
function rand(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

function densityColor(pct) {
  if (pct < 40) return '#22c55e';
  if (pct < 70) return '#fbbf24';
  return '#ef4444';
}

function densityLabel(pct) {
  if (pct < 40) return { text: 'Low',    cls: 'badge-green'  };
  if (pct < 70) return { text: 'Medium', cls: 'badge-yellow' };
  return             { text: 'High',   cls: 'badge-red'    };
}

function formatTime(d) {
  return d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

// Convert bearing + distance → SVG coords on a radius map (cx,cy = centre, R = max radius px)
function polarToSVG(bearing, distKm, cx, cy, maxKm, R) {
  const rad = ((bearing - 90) * Math.PI) / 180; // bearing from north → math angle
  const r = (distKm / maxKm) * R;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

// ─── Sensor Simulator ────────────────────────────────────────────────────────
function generateSensorData(prev) {
  return ARMS.map((arm, i) => {
    const prevCount = prev ? prev[i].count : rand(30, 90);
    const delta = rand(-12, 14);
    const count = Math.max(5, Math.min(120, prevCount + delta));
    const pct = Math.round((count / 120) * 100);
    return { ...arm, count, pct };
  });
}

// ─── Adaptive Signal Engine ───────────────────────────────────────────────────
function computeSignals(densities, adaptiveMode) {
  if (!adaptiveMode) {
    return ARMS.map((arm) => ({ armId: arm.id, greenTime: 30 }));
  }
  const total = densities.reduce((s, d) => s + d.count, 0) || 1;
  return densities.map(d => ({
    armId: d.id,
    greenTime: Math.max(10, Math.round((d.count / total) * 90)),
  }));
}

// Exit-time: minutes to travel 1 km from junction exit point, given near-junction speed
function computeExitTime(armId, segmentData) {
  const seg0 = segmentData && segmentData[armId] && segmentData[armId][0];
  const speedKmh = seg0 ? seg0.speed : 15;
  // 1 km at speedKmh → time in minutes
  return Math.max(1, Math.round((1 / speedKmh) * 60));
}

// ─── Traveller Notification Builder ───────────────────────────────────────────
function buildTravellerMessage(arm, density, dist, segmentData) {
  const wait = Math.round(density.pct * 0.15 + dist * 0.5);
  const altRoute = ALT_ROUTES[arm.id]?.any ?? { name: 'Service Road', via: 'Use parallel service road', avoid: '' };
  const exitTimeMins = computeExitTime(arm.id, segmentData);

  if (density.pct >= 75) {
    return {
      type: 'critical',
      icon: '🚨',
      msg: `Heavy congestion at Nagawara Junction (${arm.short} side). Estimated delay: ${wait} min.`,
      altRoute,
      exitTimeMins,
    };
  }
  if (density.pct >= 50) {
    return {
      type: 'warning',
      icon: '⚠️',
      msg: `Moderate traffic near Nagawara Junction (${arm.short}). ~${wait} min wait. Signal timings adjusted.`,
      altRoute,
      exitTimeMins,
    };
  }
  return {
    type: 'info',
    icon: 'ℹ️',
    msg: `Traffic flowing normally at Nagawara Junction (${arm.short}). Estimated travel time: ${wait} min.`,
    altRoute,
    exitTimeMins,
  };
}

function RadiusMap({ travellers, densities, broadcastLog }) {
  const SVG = 280, cx = 140, cy = 140, maxKm = 5, R = 110;
  // Build a set of recently notified traveller IDs for highlight
  const recentIds = useMemo(() => {
    const cutoff = Date.now() - 10000;
    return new Set(broadcastLog.filter(b => b.ts > cutoff).map(b => b.travellerId));
  }, [broadcastLog]);

  return (
    <div className="card">
      <div className="card-header">
        <div className="card-title">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#a78bfa" strokeWidth="1.5" strokeDasharray="3,2"/><circle cx="7" cy="7" r="2" fill="#a78bfa"/></svg>
          5 km Traveller Alert Zone
        </div>
        <span className="badge badge-purple">{travellers.length} travellers</span>
      </div>
      <div className="radius-map-wrap">
        <svg width={SVG} height={SVG} viewBox={`0 0 ${SVG} ${SVG}`}>
          {/* Background */}
          <circle cx={cx} cy={cy} r={R+10} fill="#0f172a"/>
          {/* Radius rings */}
          {[1,2,3,4,5].map(km => (
            <circle key={km} cx={cx} cy={cy} r={(km/maxKm)*R} fill="none" stroke="#1e293b" strokeWidth="1" strokeDasharray="3,3"/>
          ))}
          {/* Ring labels */}
          {[1,2,3,4,5].map(km => (
            <text key={km} x={cx + (km/maxKm)*R + 2} y={cy - 2} fontSize="8" fill="#334155">{km}km</text>
          ))}
          {/* Arm direction rays */}
          {ARMS.map(arm => {
            const rad = ((arm.angle - 90) * Math.PI) / 180;
            return (
              <line key={arm.id}
                x1={cx} y1={cy}
                x2={cx + (R+10)*Math.cos(rad)} y2={cy + (R+10)*Math.sin(rad)}
                stroke={arm.color} strokeWidth="1" strokeDasharray="4,3" opacity="0.4"
              />
            );
          })}
          {/* Arm labels */}
          {ARMS.map(arm => {
            const rad = ((arm.angle - 90) * Math.PI) / 180;
            const lx = cx + (R+8)*Math.cos(rad);
            const ly = cy + (R+8)*Math.sin(rad);
            const anchor = arm.angle === 0 ? 'start' : arm.angle === 180 ? 'end' : 'middle';
            return (
              <text key={arm.id} x={lx} y={ly + (arm.angle===90?8: arm.angle===270?-2:4)}
                textAnchor={anchor} fontSize="8" fill={arm.color} fontWeight="600">{arm.short}</text>
            );
          })}
          {/* Travellers */}
          {travellers.map((t, i) => {
            const pos = polarToSVG(t.bearing, t.dist, cx, cy, maxKm, R);
            const isNotified = recentIds.has(t.id);
            const col = AVATAR_COLORS[i % AVATAR_COLORS.length];
            return (
              <g key={t.id}>
                {isNotified && <circle cx={pos.x} cy={pos.y} r="10" fill={col} opacity="0.15">
                  <animate attributeName="r" from="8" to="14" dur="1s" repeatCount="indefinite"/>
                  <animate attributeName="opacity" from="0.2" to="0" dur="1s" repeatCount="indefinite"/>
                </circle>}
                <circle cx={pos.x} cy={pos.y} r="5" fill={col} opacity={isNotified ? 1 : 0.6}
                  stroke={isNotified ? '#fff' : 'none'} strokeWidth="1"/>
              </g>

function generateGpsReadings(prev) {
  return GPS_SENSOR_BASE.map((s, i) => {
    const prevSpeed = prev ? prev[i].speed : rand(8, 35);
    const speed = Math.max(2, Math.min(50, prevSpeed + rand(-6, 6)));
    // Drift coords slightly for realism
    const latDrift = (Math.random() - 0.5) * 0.0001;
    const lngDrift = (Math.random() - 0.5) * 0.0001;
    const satellites = rand(6, 12);
    const accuracy = +(Math.random() * 3 + 1).toFixed(1);
    const locked = satellites >= 7;
    return {
      ...s,
      speed,
      lat: +(s.lat + latDrift).toFixed(6),
      lng: +(s.lng + lngDrift).toFixed(6),
      satellites,
      accuracy,
      locked,
      updatedAt: Date.now(),
    };
  });
}

    { label: '3–5 km',   desc: 'Sahakara Nagar',   roads2w: 'Open road, 2W preferred' },
  ],
};

function generateSegmentData(densities, prev) {
  const result = {};
  ARMS.forEach((arm, ai) => {
    const armDensity = densities[ai] ? densities[ai].pct : 50;
    result[arm.id] = SEGMENTS_DEF[arm.id].map((seg, si) => {
      // Near-junction segment is most affected by density; far is free-flow
      const congestionFactor = si === 0 ? armDensity : si === 1 ? armDensity * 0.6 : armDensity * 0.3;
      const baseSpeed = si === 0 ? 15 : si === 1 ? 25 : 38;
      const prevSpeed = prev && prev[arm.id] ? prev[arm.id][si].speed : baseSpeed;
      const speed = Math.max(4, Math.min(55, prevSpeed + rand(-4, 4) - congestionFactor * 0.1));
      const flow = speed > 35 ? 'Free' : speed > 20 ? 'Moderate' : speed > 10 ? 'Slow' : 'Jammed';
      return { ...seg, speed: Math.round(speed), flow, armId: arm.id };
    });
  });
  return result;
}

function computeRoutes(armId, vehicleType, segmentData) {
  const opts = ROUTE_OPTIONS[armId]?.[vehicleType] ?? [];
  const segs = segmentData[armId] ?? [];
  const avgSpeed = segs.length ? segs.reduce((s, x) => s + x.speed, 0) / segs.length : 20;
  return opts.map(opt => {
    const eta = Math.round((opt.dist / (avgSpeed * opt.coeff)) * 60);
    return { ...opt, eta };
  }).sort((a, b) => a.eta - b.eta);
}

function NfComplaintFeed({ complaints, votes, onVote, densities }) {
  const [tab, setTab] = useState('all');
  const tabs = [
    { key: 'all',      label: 'All',      count: complaints.length },
    { key: 'critical', label: 'Critical', count: complaints.filter(c => c.severity === 'critical').length },
    { key: 'escalated',label: 'Escalated',count: complaints.filter(c => c.status === 'escalated').length },
    { key: 'sla',      label: 'SLA Breached', count: complaints.filter(c => c.hoursElapsed > c.slaHours && c.status !== 'resolved').length },
  ];
  const filtered = tab === 'all' ? complaints
    : tab === 'critical' ? complaints.filter(c => c.severity === 'critical')
    : tab === 'escalated' ? complaints.filter(c => c.status === 'escalated')
    : complaints.filter(c => c.hoursElapsed > c.slaHours && c.status !== 'resolved');

  return (
    <div className="card">
      <div className="card-header">
        <div className="card-title">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3h10M2 7h7M2 11h5" stroke="#f97316" strokeWidth="1.5" strokeLinecap="round"/></svg>
          Civic Issue Feed — Junction Area
        </div>
        <span className="badge badge-yellow">{complaints.length} reports</span>
      </div>
      <div className="nf-feed-tabs">
        {tabs.map(t => (
          <div key={t.key} className={`nf-tab ${tab === t.key ? 'active' : ''}`} onClick={() => setTab(t.key)}>
            {t.label} <span style={{opacity:0.7, fontSize:'10px'}}>({t.count})</span>
          </div>
        ))}
      </div>
      <div className="nf-feed">
        {filtered.map(c => {
          const sevTag = NF_SEV_TAG[c.severity] ?? NF_SEV_TAG.medium;
          const statTag = NF_STATUS_TAG[c.status] ?? NF_STATUS_TAG.open;
          const armColor = NF_ARM_COLORS[c.arm] ?? '#64748b';
          const armDensity = densities ? densities.find(d => d.id === c.arm) : null;
          const voted = votes[c.id];
          const slaBreach = c.hoursElapsed > c.slaHours;
          return (
            <div className={`nf-complaint sev-${c.severity}`} key={c.id}>
              <div className="nf-c-icon" style={{background: armColor + '22', border: `1px solid ${armColor}44`}}>
                {NF_ISSUE_ICONS[c.type] ?? '❓'}
              </div>
              <div style={{flex:1, minWidth:0}}>
                <div className="nf-c-title">{c.title}</div>
                <div className="nf-c-meta">
                  <span>📍 {c.ward}</span>
                  <span style={{color: armColor}}>→ {NF_ARM_LABELS[c.arm]}</span>
                  <span>⏰ {c.hoursElapsed}h ago</span>
                </div>
                <div className="nf-c-desc">{c.description}</div>
                {c.trafficImpact && (
                  <div style={{marginTop:'5px', background:'#1e3a5f33', border:'1px solid #1e3a5f', borderRadius:'5px', padding:'4px 8px', fontSize:'10px', color:'#60a5fa'}}>

// ─── Signal State Machine ─────────────────────────────────────────────────────
function initSignalStates(signals) {
  return signals.map((sig, i) => ({
    armId: sig.armId,
    phase: i === 0 ? 'GREEN' : 'RED',
    timer: i === 0 ? sig.greenTime : 5,
    greenTime: sig.greenTime,
  }));
}

// ─── Main App ─────────────────────────────────────────────────────────────────
function App() {
  const [time, setTime] = useState(new Date());
  const [adaptiveMode, setAdaptiveMode] = useState(true);
  const [densities, setDensities] = useState(() => generateSensorData(null));
  const [signalStates, setSignalStates] = useState(null);
  const [notifications, setNotifications] = useState([]);   // junction-level alerts
  const [broadcastLog, setBroadcastLog] = useState([]);     // per-traveller records
  const [toasts, setToasts] = useState([]);
  const [gpsData, setGpsData] = useState(() => generateGpsReadings(null));
  const [segmentData, setSegmentData] = useState(null);
  const [selectedArm, setSelectedArm] = useState('north');
  const [nfVotes, setNfVotes] = useState({});
  const [nfComplaints, setNfComplaints] = useState(NF_COMPLAINTS_SEED);
  const signalRef = useRef(null);
  const timerRef = useRef(null);
  const segmentDataRef = useRef(null);

  // Travellers: stable list, generated once
  const travellers = useMemo(() => TRAVELLER_SEEDS.map((t, i) => ({
    ...t,
    id: 'T' + i,
    short: ARMS.find(a => a.id === t.arm)?.short ?? t.arm,
  })), []);

  // Clock
  useEffect(() => {
    const id = setInterval(() => setTime(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  // Sensor update every 5s + GPS + segment data
  useEffect(() => {
    const id = setInterval(() => {
      setDensities(prev => {
        const next = generateSensorData(prev);
        setSegmentData(prevSeg => {
          const nextSeg = generateSegmentData(next, prevSeg);
          segmentDataRef.current = nextSeg;
          return nextSeg;
        });
        return next;
      });
    }, 5000);
    return () => clearInterval(id);
  }, []);

  // GPS update every 2s
  useEffect(() => {
    const id = setInterval(() => setGpsData(prev => generateGpsReadings(prev)), 2000);
    return () => clearInterval(id);
  }, []);

  // Initialise segment data on first render
  useEffect(() => {
    const initSeg = generateSegmentData(densities, null);
    setSegmentData(initSeg);
    segmentDataRef.current = initSeg;
  }, []); // eslint-disable-line

  // Signal recompute
  useEffect(() => {
    const signals = computeSignals(densities, adaptiveMode);
    if (!signalStates) {
      setSignalStates(initSignalStates(signals));
      signalRef.current = signals;
    } else {
      signalRef.current = signals;
      setSignalStates(prev => prev.map((s, i) => ({
        ...s,
        greenTime: signals[i]?.greenTime ?? s.greenTime,
      })));
    }
  }, [densities, adaptiveMode]);

  // Signal phase ticker
  useEffect(() => {
    const id = setInterval(() => {
      setSignalStates(prev => {
        if (!prev) return prev;
        return prev.map((sig, i) => {
          if (sig.timer > 1) return { ...sig, timer: sig.timer - 1 };
          if (sig.phase === 'GREEN')  return { ...sig, phase: 'YELLOW', timer: 3 };
          if (sig.phase === 'YELLOW') return { ...sig, phase: 'RED',    timer: 30 };
          const activeIdx = prev.findIndex(s => s.phase === 'GREEN' || s.phase === 'YELLOW');
          const nextIdx = (i + 1) % prev.length;
          if (nextIdx === (activeIdx === -1 ? 0 : (activeIdx + 1) % prev.length)) {
            const signals = signalRef.current;
            return { ...sig, phase: 'GREEN', timer: signals ? signals[nextIdx]?.greenTime ?? 30 : 30 };
          }
          return sig;
        });
      });
    }, 1000);
    return () => clearInterval(id);
  }, []);

  // ── Notification + 5km traveller broadcast engine ──────────────────────────
  useEffect(() => {
    function scheduleNext() {
      const delay = rand(7000, 13000);
      timerRef.current = setTimeout(() => {
        setDensities(currentDensities => {
          // Pick the arm with highest density or random
          const heavyArms = currentDensities.filter(d => d.pct > 60);
          const targetDensity = heavyArms.length > 0
            ? heavyArms[rand(0, heavyArms.length - 1)]
            : currentDensities[rand(0, 3)];
          const arm = ARMS.find(a => a.id === targetDensity.id);

          // Junction-level alert (pass segmentData via ref for exit time)
          const currentSeg = segmentDataRef.current;
          const { type, icon, msg, altRoute, exitTimeMins } = buildTravellerMessage(arm, targetDensity, 0, currentSeg);

          // Find travellers within 5km heading toward this arm
          const affected = travellers.filter(t => t.arm === arm.id);
          const reachCount = affected.length;

          const junctionNotif = {
            id: Date.now() + Math.random(),
            type, icon, msg, altRoute, exitTimeMins,
            arm: arm.short,
            time: new Date(),
            reachCount,
          };

          setNotifications(n => [...n.slice(-24), junctionNotif]);

          // Per-traveller broadcast records
          const ts = Date.now();
          const newBroadcasts = affected.map((t, bi) => {
            const perTraveller = buildTravellerMessage(arm, targetDensity, t.dist, currentSeg);
            return {
              id: ts + bi + Math.random(),
              travellerId: t.id,
              ts: ts + bi * 50,
              type: perTraveller.type,
              icon: perTraveller.icon,
              msg: perTraveller.msg,
              altRoute: perTraveller.altRoute,
              exitTimeMins: perTraveller.exitTimeMins,
            };
          });

          setBroadcastLog(prev => [...prev.slice(-99), ...newBroadcasts]);

          // Toast for critical/warning
          if (type === 'critical' || type === 'warning') {
            const toast = { ...junctionNotif, id: ts + 9999 };
            setToasts(t => [...t.slice(-2), toast]);
            setTimeout(() => setToasts(tt => tt.filter(x => x.id !== toast.id)), 7000);
          }

          return currentDensities;
        });
        scheduleNext();
      }, delay);
    }
    scheduleNext();
    return () => clearTimeout(timerRef.current);
  }, [travellers]);

  const closeToast = (id) => setToasts(t => t.filter(x => x.id !== id));
  const totalBroadcast = broadcastLog.length;

  const handleNfVote = (cid) => {
    setNfVotes(v => ({ ...v, [cid]: !v[cid] }));
  };

  const handleNfSubmit = (report) => {
    const newComplaint = {
      id: report.id,
      title: report.title,
      description: report.desc || 'No description provided.',
      type: report.type,
      severity: report.severity,
      status: 'open',
      ward: NF_ARM_LABELS[report.arm] ?? report.arm,
      arm: report.arm,
      upvotes: 0,
      escalationLevel: 1,
      hoursElapsed: 0,
      slaHours: report.severity === 'critical' ? 24 : report.severity === 'high' ? 72 : 168,
      aiClassification: `${report.type.charAt(0).toUpperCase() + report.type.slice(1)} · AI-classified · ${NF_ARM_LABELS[report.arm] ?? report.arm}`,
      filedAt: new Date().toISOString(),
      trafficImpact: `New report near ${NF_ARM_LABELS[report.arm]} — monitoring for traffic impact`,
    };
    setNfComplaints(prev => [newComplaint, ...prev]);
  };

  return (
    <div className="app">
      <TopBar time={time} adaptiveMode={adaptiveMode} onToggleAdaptive={() => setAdaptiveMode(m => !m)}/>
      <StatCards densities={densities} broadcastCount={totalBroadcast}/>
      <div className="main">
        <JunctionMap densities={densities} signalStates={signalStates}/>
        <DensityPanel densities={densities}/>
        <NotificationsPanel notifications={notifications}/>
        <div className="full-span">
          <SignalPanel signalStates={signalStates} adaptiveMode={adaptiveMode}/>
        </div>
      </div>
      <div className="bottom-row">
        <RadiusMap travellers={travellers} densities={densities} broadcastLog={broadcastLog}/>
        <BroadcastLog broadcastLog={broadcastLog} travellers={travellers}/>
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'12px', padding:'0 12px 12px'}}>
        <GpsSensorPanel gpsData={gpsData}/>
        <SegmentSpeedMap segmentData={segmentData}/>
      </div>
      <div style={{padding:'0 12px 12px'}}>
        <RouteAdvisor segmentData={segmentData} selectedArm={selectedArm} onSelectArm={setSelectedArm}/>
      </div>

      {/* ── NammaFix Citizen Reporting Integration ─────────────────────── */}
      <div className="nf-section">
        <div className="nf-section-header">
          <div>
            <div className="nf-section-title">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <rect width="18" height="18" rx="5" fill="#f97316"/>
                <path d="M9 4v5l3 2" stroke="#fff" strokeWidth="1.8" strokeLinecap="round"/>
                <circle cx="9" cy="9" r="6" stroke="#fff" strokeWidth="1.5" fill="none"/>
              </svg>
              NammaFix — Citizen Civic Reporting
            </div>
            <div className="nf-section-sub">
              Road issues filed by citizens in wards surrounding Nagawara Junction · directly linked to live traffic density per arm
            </div>
          </div>
          <div style={{display:'flex', gap:'8px', flexWrap:'wrap'}}>
            {densities.map(d => (
              <div key={d.id} style={{background: '#0f172a', border:`1px solid ${NF_ARM_COLORS[d.id]}44`, borderRadius:'7px', padding:'4px 10px', fontSize:'11px', fontWeight:'600'}}>
                <span style={{color: NF_ARM_COLORS[d.id]}}>{d.short}</span>
                <span style={{color: d.pct > 70 ? '#f87171' : d.pct > 40 ? '#fbbf24' : '#4ade80', marginLeft:'5px'}}>{d.pct}%</span>
              </div>
            ))}
          </div>
        </div>
        <div className="nf-grid">
          <NfComplaintFeed complaints={nfComplaints} votes={nfVotes} onVote={handleNfVote} densities={densities}/>
          <NfWardScoreboard densities={densities}/>
          <NfFileReport onSubmit={handleNfSubmit}/>
        </div>
      </div>

      <ToastContainer toasts={toasts} onClose={closeToast}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
